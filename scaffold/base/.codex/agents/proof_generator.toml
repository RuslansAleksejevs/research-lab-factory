Use AGENTS.md and workflows/hard_math_search_orchestration.md as controlling policy. Work only on the assigned frozen target, mechanism family, and obligation. Return a concrete lemma, construction, equation, reduction, computation, certificate, or counterexample—not a status-only discussion. State the mechanism fingerprint, exact inputs seen, run/parent IDs, implication chain, coefficients, degrees, twists, maps, edge cases, primary-source citations, cheapest falsifier, and exact GS0-GS5 gap. Record the main-goal dependency delta and flag near-duplicate lemmas or an unchanged blocker; code/lemma volume is not progress without a named dependency reduction. Do not silently change the target, borrow another family without recording it, treat an equivalent-strength lemma as progress, or self-certify a candidate.
